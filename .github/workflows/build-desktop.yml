name: Build Desktop Executável

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma alvo'
        required: true
        default: 'all'
        type: choice
        options:
          - windows
          - mac
          - linux
          - all

jobs:
  build-desktop:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: '*.exe'
          - os: macos-latest
            platform: mac
            artifact: '*.dmg'
          - os: ubuntu-latest
            platform: linux
            artifact: '*.AppImage'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API backend
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/assistente-juridico run build

      - name: Install Electron dependencies
        working-directory: artifacts/desktop
        run: npm install

      - name: Build ${{ matrix.platform }} executable
        working-directory: artifacts/desktop
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sk-juridico-${{ matrix.platform }}-${{ github.ref_name || 'latest' }}
          path: artifacts/desktop/dist-electron/${{ matrix.artifact }}
          retention-days: 30

  release-desktop:
    name: Criar Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: sk-juridico-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**
          name: SK Jurídico Desktop ${{ github.ref_name }}
          body: |
            ## SK Jurídico IA Desktop ${{ github.ref_name }}

            ### Downloads

            | Plataforma | Arquivo | Instruções |
            |-----------|---------|------------|
            | 🪟 Windows | `SK Juridico Setup *.exe` | Execute e instale normalmente |
            | 🍎 macOS | `SK Juridico *.dmg` | Arraste para Applications |
            | 🐧 Linux | `SK Juridico *.AppImage` | `chmod +x *.AppImage && ./*.AppImage` |

            ### Configuração inicial
            1. Na primeira execução, vá em **Configurações → Banco DB** e configure sua URL PostgreSQL
            2. Configure suas chaves de IA em **Configurações → Chaves de API**
            3. Comece a usar!
