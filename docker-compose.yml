version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sk_user
      POSTGRES_PASSWORD: sk_pass
      POSTGRES_DB: sk_juridico
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://sk_user:sk_pass@db:5432/sk_juridico
      SESSION_SECRET: ${SESSION_SECRET:-sk-juridico-secret-change-me}
      NODE_ENV: production
      PORT: 8080
      BASE_PATH: /api
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./local-config.json:/app/local-config.json

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./artifacts/assistente-juridico/dist/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
